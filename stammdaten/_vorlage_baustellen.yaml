# Alle Baustellen einmal hier eintragen, dann nie wieder Adressen tippen.
# Kopie liegt im Datenordner unter hotels/baustellen.yaml.
#
# Die Koordinaten sind das Entscheidende: Danach wird gesucht, nicht nach dem
# Ortsnamen. Ein Hotel "in Fulda" kann 12 km von der Baustelle weg sein.
# Koordinaten nicht zur Hand? Adresse angeben und Claude einmalig ergänzen lassen.

baustellen:
  - kuerzel: BHV                      # kurz, eindeutig, so rufst du sie auf
    projektnummer: "2451"
    kurzname: Carl Zeiss Bremerhaven
    bauvorhaben: Neubau Betriebsrestaurant, Bauteil C
    strasse: Beispielstraße 1
    plz: "27568"
    ort: Bremerhaven
    koordinaten:
      lat: 53.5396
      lon: 8.5809
    # Nur setzen, wenn es hier anders ist als in kriterien.yaml:
    max_entfernung_km: 20             # ländlich, größerer Radius nötig
    hinweis: "Zufahrt über Nordtor, Schlüsselübergabe 6:45 Uhr"

  - kuerzel: BER
    projektnummer: "2478"
    kurzname: Upbeat Berlin
    bauvorhaben: Küche Bürogebäude, 3. OG
    strasse: Beispielallee 12
    plz: "10115"
    ort: Berlin
    koordinaten:
      lat: 52.5200
      lon: 13.4050
    max_entfernung_km: 8              # Stadt, kurze Wege, aber teuer
    hinweis: "Zufahrt nur über den Hinterhof"
