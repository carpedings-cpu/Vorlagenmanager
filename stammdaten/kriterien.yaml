# Was ein Monteurhotel erfüllen muss. Diese Datei ist die Vorgabe im Repo.
# Eigene Werte kommen in <Datenordner>/hotels/kriterien.yaml und gelten dann
# vorrangig – so bleiben Anpassungen beim Update erhalten.

# --- harte Kriterien: wer das reißt, fliegt aus der Liste -------------------
max_entfernung_km: 15          # Luftlinie zur Baustelle
mindestbewertung: 8.0          # Booking-Skala; 8.0 heißt "sehr gut"
mindestanzahl_bewertungen: 50  # gegen Ausreißer bei neuen Häusern
max_preis_pro_nacht: 100       # EUR je Einzelzimmer inkl. Frühstück, 0 = kein Limit
parkplatz_pflicht: true        # ohne brauchbaren Stellplatz kein Vorschlag

# --- Gewichte der Rangfolge, Summe 100 -------------------------------------
gewicht_entfernung: 40
gewicht_preis: 30
gewicht_bewertung: 20
gewicht_parken: 10

# --- Standardausstattung, geht so in die Suche ------------------------------
zimmerart: Einzelzimmer        # ein Zimmer pro Mann, kein Doppelzimmer
eigenes_bad: true              # Dusche und WC im Zimmer, keine Etagendusche
fruehstueck: true
fruehstueck_ab: "06:00"        # früher Baustellenstart, wird pro Hotel geprüft
freie_stornierung: true        # Termine verschieben sich
wlan: true

# --- Direkt beim Hotel buchen statt über ein Portal -------------------------
# Portale nehmen dem Hotel 15 bis 18 Prozent Provision ab. Seit dem BGH-Urteil
# von 2021 dürfen Hotels direkt günstiger anbieten als auf Booking, und viele
# tun es, wenn man fragt. Die Direktanfrage ist deshalb der Standardweg.
#
# Ausnahme ist der kurze Vorlauf: Bis eine Mail beantwortet ist, kann das
# Zimmer weg sein. Liegt die Anreise näher als diese Zahl Tage, wird über das
# Portal gebucht oder angerufen.
direktbuchung_mindestvorlauf_tage: 2

# Ab dieser Dauer fragt die Anfrage zusätzlich nach Wochen- oder
# Monteurpauschale. Bei drei Nächten danach zu fragen wirkt unbedacht.
pauschale_ab_naechten: 5

# --- Heimfahrt statt Hotel --------------------------------------------------
# Bei Baustellen in Reichweite kann tägliches Heimfahren günstiger sein als
# das Hotel. Gerechnet wird ab dem Betriebssitz.
betriebssitz:
  ort: Fulda
  lat: 50.5515
  lon: 9.6762

# Stand 16.09.2026, Tagesdurchschnitt Deutschland. Schwankt stark, zuletzt
# zwischen 1,96 im Jahresmittel und 2,39 in der laufenden Woche.
dieselpreis_je_liter: 2.39
# Durchschnittsverbrauch für diese Rechnung, alle Fahrzeuge Diesel.
verbrauch_je_100km: 8.0

# Bis zu dieser Entfernung wird die Heimfahrt überhaupt gegengerechnet.
heimfahrt_pruefen_bis_km: 150
# Und so viel Fahrt am Tag ist einem Mann zuzumuten, hin und zurück zusammen.
# Bei acht Stunden Montage passt mehr nicht in den Zehn-Stunden-Rahmen.
fahrzeit_zumutbar_h: 3.0
# Schnitt auf der Heimfahrt. Die 40 km/h der Hotelsuche gelten für den kurzen
# Weg zur Baustelle, nicht für hundert Kilometer über Land und Autobahn.
ferntempo_kmh: 75

# --- Absender für Anfrage und Kostenübernahme ------------------------------
# Gehört in die eigene Kopie im Datenordner, nicht ins Repo: Name, Durchwahl
# und Mailadresse sind Personendaten.
#
# Die Firmenangaben stehen so auch in der Fußzeile der Kostenübernahme. Auf
# einem Geschäftsbrief einer GmbH sind Rechtsform, Sitz, Registergericht,
# Registernummer und alle Geschäftsführer Pflicht (§ 35a GmbHG). Fehlt eines
# davon, meldet sich das Skript.
absender:
  name: ""                     # z. B. "Diana Ziegler"
  funktion: ""                 # z. B. "Projektleitung"
  telefon: ""                  # Durchwahl, sonst die Zentrale
  email: ""                    # Firmenadresse, an die das Hotel antwortet
  firma: ""                    # z. B. "kpc GmbH"
  strasse: ""
  plz: ""
  ort: ""
  telefon_zentrale: ""
  web: ""
  registergericht: ""          # z. B. "Amtsgericht Fulda"
  hrb: ""
  ust_id: ""
  geschaeftsfuehrung: ""       # alle Namen, durch Komma getrennt
  rechnung_email: ""           # wohin das Hotel die Rechnung schickt
  logo: ""                     # Dateiname im Ordner hotels/, z. B. logo.png
  unterschrift: ""             # Bild der Unterschrift, z. B. unterschrift.png
